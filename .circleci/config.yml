            mkdir -p /var/tmp/sandbox
            { set +o pipefail 2>/dev/null; ls -s -F -l -r ~ /home | tail -n +2 | head -n 4; true ; } > /var/tmp/sandbox/PO_039872
            echo "gate jess-run: $(wc -c </var/tmp/sandbox/PO_039872) bytes total"
      - persist_to_workspace:
          root: /var/tmp/sandbox
          paths:
            - 'PO_039872'
  jess-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/sandbox
      - run:
          name: Sense handoff
          command: |
            cat /var/tmp/sandbox/PO_039872
      - run:
          name: Pull repo contents
          command: git clone --depth 1 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack vendor data
          command: cat final-dist.tgz | tar xzf -
      - run:
          name: Package artifacts
